[project]
name = "invoice-extraction-pipeline"
version = "0.1.0"
description = "Turn invoice PDFs and scans into validated, structured data with OCR + LLM extraction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zohaib Tariq" }]
dependencies = [
  "pydantic>=2.6",
  "pdfplumber>=0.11",
  "pytesseract>=0.3.10",
  "pillow>=10",
  "openai>=1.40",
  "anthropic>=0.40",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
sheets = ["gspread>=6.0"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0"]

[project.scripts]
invoice-extract = "invoice_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["invoice_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
