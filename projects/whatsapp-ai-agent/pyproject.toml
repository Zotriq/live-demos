[project]
name = "whatsapp-ai-agent"
version = "0.1.0"
description = "WhatsApp AI agent: answers customers, checks availability, books appointments and hands off to a human"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zohaib Tariq" }]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "openai>=1.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wa_agent"]

[tool.setuptools.package-data]
wa_agent = ["business.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
