[project]
name = "langgraph-support-agents"
version = "0.1.0"
description = "Multi-agent customer support team on LangGraph: supervisor routing, specialist agents, QA review loop and human approval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zohaib Tariq" }]
dependencies = [
  "langgraph>=0.4",
  "langgraph-checkpoint-sqlite>=2.0",
  "openai>=1.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
support-agents = "support_agents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["support_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
