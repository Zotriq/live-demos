[project]
name = "sql-etl-pipeline"
version = "0.1.0"
description = "Multi-source ETL pipeline: messy CSV exports + exchange-rate API -> validated, deduplicated PostgreSQL tables"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zohaib Tariq" }]
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.6",
  "email-validator>=2.1",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
etl = "etl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
