name: Test demos

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq $(cat packages.txt)
      - run: pip install -q -r requirements.txt pytest
      - name: Click through every demo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          pytest tests -s -v --tb=short -p no:warnings 2>&1 | tee pytest.log
      - name: Put the test output on the run summary page
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 60000 pytest.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
