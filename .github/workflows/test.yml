name: Test demos

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq $(cat packages.txt) libxml2
      - run: pip install -q -r requirements.txt pytest
      - name: Click through every demo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          pytest tests -s -v --tb=line -p no:warnings 2>&1 | tee pytest.log
      - name: Put the test output on the run summary page
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "(PASSED|FAILED|SKIPPED|ERROR)$|^FAILED|passed|failed" pytest.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '----- demo output -----' >> "$GITHUB_STEP_SUMMARY"
          grep -vE "^(tests/|  |platform|cachedir|rootdir|plugins|collecting|collected|$)" pytest.log | cut -c1-400 | tail -c 40000 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
